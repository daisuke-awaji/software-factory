name: ci

# 型チェック・テスト・ビルド（実装計画 §8）。web の E2E は MSW のモックで動かす
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @factory/web exec playwright install --with-deps chromium
      - run: pnpm --filter @factory/web e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: packages/web/test-results
